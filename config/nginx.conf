upstream backend {
    server backend:5000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 32;
}

upstream admin {
    server admin:80;
    keepalive 32;
}

# Rate limit zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

server {
    listen 80;
    server_name _;  # Replace with your domain

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Body size limit
    client_max_body_size 20M;

    # ── Auth routes: strict rate limit ──────────────────────────────────────
    location ~ ^/(auth/login|auth/register) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── API routes: proxy to Express backend ────────────────────────────────
    location ~ ^/(auth|accounts|transactions|analytics|budgets|alerts|profile|documents|trust|compliance|consent-grants|partner|public|recurring-rules|upload|export|api)/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health check ────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Static uploads ──────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Admin panel SPA (TrustLane Admin) ───────────────────────────────────
    # Trailing slashes on both `location` and `proxy_pass` strip the /admin
    # prefix before forwarding, so the admin container serves requests as if
    # it were mounted at its own document root (its Vite build already emits
    # asset URLs under /admin/ via `base: '/admin/'`, matching this prefix).
    location /admin/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Frontend SPA (all other routes) ─────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Trop de requ\u00eates. Veuillez patienter."}';
        add_header Content-Type application/json;
    }
}

