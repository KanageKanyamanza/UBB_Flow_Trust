version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ubb_flow_trust_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rolldu98
      POSTGRES_DB: ubb_flow_trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
