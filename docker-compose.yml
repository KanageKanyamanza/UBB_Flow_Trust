version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ubb_flow_trust_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rolldu98
      POSTGRES_DB: ubb_flow_trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubb_flow_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:rolldu98@postgres:5432/ubb_flow_trust?schema=public
      - PORT=5000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ubb_flow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
